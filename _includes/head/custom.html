<!-- start custom head snippets -->

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<script>
  // Open links that leave the site (and PDF files) in a new tab.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("a[href]").forEach(function (a) {
      var url;
      try { url = new URL(a.getAttribute("href"), window.location.href); } catch (e) { return; }
      var external = /^https?:$/.test(url.protocol) && url.host !== window.location.host;
      var pdf = /\.pdf$/i.test(url.pathname);
      if (!external && !pdf) return;
      a.setAttribute("target", "_blank");
      var rel = (a.getAttribute("rel") || "").split(/\s+/).filter(Boolean);
      ["noopener", "noreferrer"].forEach(function (r) { if (rel.indexOf(r) < 0) rel.push(r); });
      a.setAttribute("rel", rel.join(" "));
    });
  });
</script>

<!-- end custom head snippets -->

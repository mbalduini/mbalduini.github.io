        Week 2014 and EXPO Milano 2015. IEEE MultiMedia Best Paper Award 2016.
    - title: "Fluxedo"
      meta: "2015"
      text: >-
        Co-founded startup for continuous visual analytics; its first social media monitoring product
        was built on the heterogeneous stream processing engine from my PhD.

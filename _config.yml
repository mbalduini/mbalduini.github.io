# Site settings
# This file is *NOT* reloaded automatically by 'jekyll serve': restart the server after editing it.

title: Marco Balduini
name: Marco Balduini
email: marco.balduini@quantiaconsulting.com
description: >- # this means to ignore newlines
  Marco Balduini — PhD, CEO of Quantia Consulting and co-founder & COO of Motus ml.
  Knowledge Graphs, enterprise generative AI, edge ML and data & AI training.
url: "https://marcobalduini.com"
baseurl: ""
locale: en
github_username: mbalduini
og_image: /assets/images/og-marco-balduini.jpg
og_image_alt: Marco Balduini
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.1

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from

# The sidebar content lives in _data/authors.yml (one entry per language).
author:
  name   : "Marco Balduini"
  avatar : "/assets/images/marco-balduini.jpg"

defaults:
  # every page: English unless overridden
  - scope:
      path: ""
    values:
      lang: en
      locale: en
      author: en
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # Italian pages
  - scope:
      path: "_pages/it"
      type: pages
    values:
      lang: it
      locale: it
      author: it

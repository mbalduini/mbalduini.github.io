# Site settings
# This file is *NOT* reloaded automatically by 'jekyll serve': restart the server after editing it.

title: Marco Balduini
name: Marco Balduini
email: marco.balduini@quantiaconsulting.com
description: >- # this means to ignore newlines
  Marco Balduini — PhD, CEO of Quantia Consulting and co-founder & COO of Motus ml.
  Knowledge Graphs, enterprise generative AI, edge ML and data & AI training.
url: "https://marcobalduini.com"
baseurl: ""
locale: en
github_username: mbalduini
og_image: /assets/images/og-marco-balduini.jpg
og_image_alt: Marco Balduini
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.1

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-redirect-from

author:
  name   : "Marco Balduini"
  avatar : "/assets/images/marco-balduini.jpg"
  bio    : "Data & AI practitioner. PhD, Politecnico di Milano. CEO of Quantia Consulting, co-founder & COO of Motus ml."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:marco.balduini@quantiaconsulting.com"
    - label: "Quantia Consulting"
      icon: "fas fa-fw fa-building"
      url: "https://www.quantiaconsulting.com"
    - label: "Motus ml"
      icon: "fas fa-fw fa-microchip"
      url: "https://motusml.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/mbalduini"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/mbalduini"
    - label: "DBLP"
      icon: "fas fa-fw fa-book"
      url: "https://dblp.org/pid/122/5489.html"
    # TODO: uncomment when the URLs are available
    # - label: "ORCID"
    #   icon: "fab fa-fw fa-orcid"
    #   url: "TODO_ORCID_URL"
    # - label: "Google Scholar"
    #   icon: "fab fa-fw fa-google-scholar"
    #   url: "TODO_SCHOLAR_URL"

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
